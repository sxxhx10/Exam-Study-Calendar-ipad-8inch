<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험기간 캘린더 계획표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 배경 이미지 (to.png) 적용 및 화면 고정 */
        body {
            background-image: url('to.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* 체크된 할 일의 취소선 및 색상 스타일 */
        .task-completed { 
            text-decoration: line-through; 
            color: #9ca3af; 
            transition: all 0.2s ease-in-out;
        }
        
        /* 스크롤바 디자인 (모달창) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- 메인 캘린더 컨테이너 (반투명 및 블러 효과) -->
    <div class="w-full max-w-5xl mx-auto bg-white/80 backdrop-blur-md rounded-2xl shadow-2xl overflow-hidden border border-white/50 p-6">
        
        <!-- 상단 헤더: 날짜 설정 및 D-Day -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-200/60 pb-4">
            <!-- 왼쪽: 시험일(기준일) 설정 -->
            <div class="flex flex-col">
                <label for="exam-date" class="text-xs font-semibold text-slate-500 mb-1">🎯 시험일(D-Day) 설정</label>
                <input type="date" id="exam-date" class="bg-white/80 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow backdrop-blur-sm">
            </div>

            <!-- 중앙: 캘린더 월 이동 -->
            <div class="flex items-center space-x-4">
                <button id="prev-month" class="p-2 rounded-full hover:bg-slate-200/50 text-slate-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="month-year-label" class="text-2xl font-bold text-slate-800 min-w-[120px] text-center">2026년 9월</h2>
                <button id="next-month" class="p-2 rounded-full hover:bg-slate-200/50 text-slate-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- 오른쪽: D-Day 표시 -->
            <div class="text-right">
                <div id="d-day-display" class="text-4xl font-extrabold text-indigo-600 tracking-tight">D-Day</div>
            </div>
        </div>

        <!-- 캘린더 요일 헤더 -->
        <div class="grid grid-cols-7 gap-2 text-center font-bold text-sm mb-2 text-slate-500">
            <div class="text-rose-500">일</div>
            <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div>
            <div class="text-blue-500">토</div>
        </div>

        <!-- 캘린더 그리드 -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-2">
            <!-- 자바스크립트로 날짜 생성됨 -->
        </div>
    </div>

    <!-- 모달: 할 일 작성 창 -->
    <div id="task-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white/95 backdrop-blur-lg p-6 rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-5">
                <h3 id="modal-date-label" class="text-xl font-bold text-slate-800"></h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex gap-2 mb-4">
                <input type="text" id="new-task-input" class="flex-1 border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="오늘의 할 일을 입력하세요..." autocomplete="off">
                <button id="add-task-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold transition-colors text-sm">추가</button>
            </div>
            
            <ul id="task-list" class="space-y-2 overflow-y-auto flex-1 pr-1">
                <!-- 자바스크립트로 할 일 목록 생성됨 -->
            </ul>
        </div>
    </div>

    <script>
        const examDateInput = document.getElementById('exam-date');
        const dDayDisplay = document.getElementById('d-day-display');
        const monthYearLabel = document.getElementById('month-year-label');
        const calendarGrid = document.getElementById('calendar-grid');
        const taskModal = document.getElementById('task-modal');
        const modalDateLabel = document.getElementById('modal-date-label');
        const newTaskInput = document.getElementById('new-task-input');
        const taskList = document.getElementById('task-list');

        let currentViewDate = new Date();
        let selectedDateStr = null;

        let tasksData = JSON.parse(localStorage.getItem('myExamTasks')) || {};
        let savedExamDate = localStorage.getItem('myExamDate') || '';

        if (savedExamDate) examDateInput.value = savedExamDate;
        calculateDDay();
        renderCalendar();

        examDateInput.addEventListener('change', () => {
            localStorage.setItem('myExamDate', examDateInput.value);
            calculateDDay();
        });

        document.getElementById('prev-month').addEventListener('click', () => {
            currentViewDate.setMonth(currentViewDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentViewDate.setMonth(currentViewDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        taskModal.addEventListener('click', (e) => {
            if(e.target === taskModal) closeModal();
        });

        document.getElementById('add-task-btn').addEventListener('click', addTask);
        newTaskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        function calculateDDay() {
            if (!examDateInput.value) {
                dDayDisplay.textContent = 'D-Day 설정';
                dDayDisplay.className = "text-2xl font-bold text-slate-400";
                return;
            }
            
            const today = new Date();
            today.setHours(0,0,0,0);
            const exam = new Date(examDateInput.value);
            exam.setHours(0,0,0,0);

            const diffTime = exam - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                dDayDisplay.textContent = `D-${diffDays}`;
                dDayDisplay.className = "text-4xl font-extrabold text-indigo-600 tracking-tight";
            } else if (diffDays === 0) {
                dDayDisplay.textContent = `D-DAY!`;
                dDayDisplay.className = "text-4xl font-extrabold text-rose-600 tracking-tight animate-pulse";
            } else {
                dDayDisplay.textContent = `D+${Math.abs(diffDays)}`;
                dDayDisplay.className = "text-3xl font-extrabold text-slate-500 tracking-tight";
            }
        }

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();

            monthYearLabel.textContent = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'p-2 bg-slate-50/30 rounded-xl opacity-50';
                calendarGrid.appendChild(emptyDiv);
            }

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            for (let i = 1; i <= daysInMonth; i++) {
                const dateObj = new Date(year, month, i);
                const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayOfWeek = dateObj.getDay();

                const dayDiv = document.createElement('div');
                dayDiv.className = 'p-2 bg-white/70 backdrop-blur-sm rounded-xl border border-slate-200/60 min-h-[100px] hover:bg-white hover:shadow-lg hover:border-indigo-300 transition-all cursor-pointer flex flex-col group';
                dayDiv.onclick = () => openModal(dateStr, i);

                const isToday = dateStr === todayStr;
                
                let textColor = 'text-slate-700';
                if (dayOfWeek === 0) textColor = 'text-rose-500';
                if (dayOfWeek === 6) textColor = 'text-blue-500';

                const header = document.createElement('div');
                header.innerHTML = `<span class="inline-block w-7 h-7 text-center leading-7 text-sm font-semibold rounded-full ${textColor} ${isToday ? 'bg-indigo-600 text-white' : 'group-hover:bg-slate-100'}">${i}</span>`;
                dayDiv.appendChild(header);

                if (tasksData[dateStr] && tasksData[dateStr].length > 0) {
                    const previewCont = document.createElement('div');
                    previewCont.className = 'mt-1 flex flex-col gap-0.5 overflow-hidden text-[11px] leading-tight';
                    
                    tasksData[dateStr].slice(0, 3).forEach(task => {
                        const tItem = document.createElement('div');
                        tItem.className = `truncate px-1 rounded ${task.completed ? 'task-completed bg-slate-100/50' : 'text-slate-700 bg-indigo-100/70'}`;
                        tItem.textContent = task.text;
                        previewCont.appendChild(tItem);
                    });

                    if (tasksData[dateStr].length > 3) {
                        const moreInfo = document.createElement('div');
                        moreInfo.className = 'text-[10px] text-slate-500 mt-1 pl-1 font-medium';
                        moreInfo.textContent = `+${tasksData[dateStr].length - 3}개 더보기`;
                        previewCont.appendChild(moreInfo);
                    }
                    dayDiv.appendChild(previewCont);
                }

                calendarGrid.appendChild(dayDiv);
            }
        }

        function openModal(dateStr, dayNum) {
            selectedDateStr = dateStr;
            const parts = dateStr.split('-');
            modalDateLabel.textContent = `${parts[0]}년 ${parts[1]}월 ${parts[2]}일 할 일`;
            taskModal.classList.remove('hidden');
            newTaskInput.focus();
            renderTasks();
        }

        function closeModal() {
            taskModal.classList.add('hidden');
            selectedDateStr = null;
            renderCalendar(); 
        }

        function renderTasks() {
            taskList.innerHTML = '';
            const tasks = tasksData[selectedDateStr] || [];

            if (tasks.length === 0) {
                taskList.innerHTML = '<li class="text-sm text-slate-400 text-center py-4">등록된 할 일이 없습니다.</li>';
                return;
            }

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3 rounded-lg border ${task.completed ? 'bg-slate-50 border-slate-100' : 'bg-white border-slate-200'}`;

                const leftDiv = document.createElement('div');
                leftDiv.className = 'flex items-center gap-3 flex-1 overflow-hidden';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.completed;
                checkbox.className = 'w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer';
                checkbox.onchange = () => toggleTaskStatus(index);

                const span = document.createElement('span');
                span.className = `text-sm font-medium flex-1 truncate ${task.completed ? 'task-completed' : 'text-slate-700'}`;
                span.textContent = task.text;

                leftDiv.appendChild(checkbox);
                leftDiv.appendChild(span);

                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                deleteBtn.className = 'text-slate-400 hover:text-rose-500 p-1 transition-colors';
                deleteBtn.onclick = () => deleteTask(index);

                li.appendChild(leftDiv);
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });
        }

        function addTask() {
            const text = newTaskInput.value.trim();
            if (!text) return;

            if (!tasksData[selectedDateStr]) {
                tasksData[selectedDateStr] = [];
            }
            
            tasksData[selectedDateStr].push({ text: text, completed: false });
            saveTasks();
            
            newTaskInput.value = '';
            renderTasks();
        }

        function toggleTaskStatus(index) {
            tasksData[selectedDateStr][index].completed = !tasksData[selectedDateStr][index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasksData[selectedDateStr].splice(index, 1);
            if (tasksData[selectedDateStr].length === 0) {
                delete tasksData[selectedDateStr];
            }
            saveTasks();
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('myExamTasks', JSON.stringify(tasksData));
        }
    </script>
</body>
</html>
